[project]
name = "sevenu-maintenance"
version = "0.1.0"
description = "7u offline-memory private question app and PC voice maintenance"
requires-python = ">=3.14"
dependencies = [
  "pilk>=0.2.4",
  "protobuf>=7.34.1",
  "sqlcipher3>=0.6.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
exclude = ["third_party", "app", "data", "**/.venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
