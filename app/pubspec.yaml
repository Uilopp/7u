name: couple_app
description: "7u private relationship gift app."
publish_to: 'none'

# Android versionName + monotonically increasing versionCode.
# Only the maintenance release workflow updates this after a verified build.
version: 0.1.261104+9

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.3
  path_provider: ^2.1.6

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  # Generated/private assets stay out of Git. Fresh clones can prepare safe
  # synthetic fixtures with tool/prepare_test_assets.py; see README.md.
  assets:
    - assets/agent/prompt.md
    - assets/memory/memory_pack.db
    - assets/memory/daily_memories.json
